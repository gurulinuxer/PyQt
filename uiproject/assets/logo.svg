<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#4bec0bff"/>
      <stop offset="100%" stop-color="#66c45eff"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="8" fill="#ffffff" />
  <rect x="8" y="8" width="784" height="144" rx="6" fill="url(#g)" opacity="0.95"/>

  <!-- Left area reserved for the Qt logo. Replace with a real `assets/qt_logo.svg` file for the official mark. -->
  <g id="left-logo-area" transform="translate(20,16)">
    <rect x="0" y="0" width="160" height="128" rx="8" fill="#ffffff" opacity="0.12" />
    <!-- If a PNG logo exists at assets/qt_logo.png it will be displayed here -->
    <image x="0" y="0" width="160" height="128" xlink:href="qt_logo.png" preserveAspectRatio="xMidYMid meet" />
    <!-- Fallback label if image not supported by viewer -->    
  </g>

  <!-- Main title and credits on the right side -->
  <g transform="translate(200,28)">
    <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#ffffff">Qt Educational Demo</text>
    <text x="0" y="74" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e6f7ff">by <tspan font-weight="700">@gurulinuxer</tspan></text>
    <a xlink:href="https://github.com/gurulinuxer/PyQt">
      <text x="0" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dceffd">https://github.com/gurulinuxer/PyQt</text>
    </a>
  </g>
</svg>
